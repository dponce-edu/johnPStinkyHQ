<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Escapade</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <header>
    <h1>Club Escapade</h1>
    <p>Looks like you got some free time. Check out these old things!</p>
  </header>

  <main>
    <ul id="grid" class="grid"></ul>
    <p id="empty" class="empty" hidden>No games yet. Add one in games.js.</p>
  </main>
</div>

<script src="games.js"></script>
<script>
  var grid = document.getElementById("grid");
  var games = window.GAMES || [];

  function initials(title) {
    var words = title.trim().split(/\s+/);
    var s = words.length > 1 ? words[0][0] + words[1][0] : title.slice(0, 2);
    return s.toUpperCase();
  }

  function placeholder(game) {
    var ph = document.createElement("div");
    ph.className = "ph";
    ph.textContent = initials(game.title);
    return ph;
  }

  games.forEach(function (game) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "card";
    a.href = "play.html?game=" + encodeURIComponent(game.id);

    var thumb = document.createElement("div");
    thumb.className = "thumb";
    var img = document.createElement("img");
    img.alt = "";
    img.loading = "lazy";
    img.src = game.thumb || "thumbs/" + game.id + ".png";
    img.onerror = function () { thumb.replaceChildren(placeholder(game)); };
    thumb.appendChild(img);

    var info = document.createElement("div");
    info.className = "info";
    info.dataset.game = game.id;
    var h2 = document.createElement("h2");
    h2.textContent = game.title;
    info.appendChild(h2);
    if (game.blurb) {
      var p = document.createElement("p");
      p.textContent = game.blurb;
      info.appendChild(p);
    }

    a.appendChild(thumb);
    a.appendChild(info);
    li.appendChild(a);
    grid.appendChild(li);
  });

  if (!games.length) document.getElementById("empty").hidden = false;

  // Average ratings from the comments server, if it's running.
  fetch("/api/ratings", { credentials: "same-origin" })
    .then(function (res) {
      var type = res.headers.get("Content-Type") || "";
      return res.ok && type.indexOf("application/json") !== -1 ? res.json() : null;
    })
    .then(function (data) {
      if (!data) return;
      Object.keys(data.ratings).forEach(function (id) {
        var info = grid.querySelector('.info[data-game="' + id + '"]');
        if (!info) return;
        var r = data.ratings[id];
        var p = document.createElement("p");
        p.className = "rating";
        p.textContent = "★ " + r.avg.toFixed(1) + " (" + r.count + ")";
        p.setAttribute("aria-label", "Rated " + r.avg.toFixed(1) + " out of 5 by " + r.count);
        info.appendChild(p);
      });
    })
    .catch(function () { /* no server: no ratings shown */ });
</script>
</body>
</html>
