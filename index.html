<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Escapade</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Title bar across the top of every page: site name on the left;
     account.js adds the name / Log out box on the right. -->
<header class="site-bar">
  <a class="site-name" href="index.html">Club Escapade</a>
</header>

<div class="wrap">

  <main>
    <ul id="grid" class="grid"></ul>
    <p id="empty" class="empty" hidden>No games yet. Add one in games.js.</p>
    <p id="unlock-count" class="unlock-count" hidden></p>
  </main>
</div>

<script src="games.js"></script>
<!-- Hidden games: only loads for admins and accounts allowed to see them. -->
<script src="games/hidden/games.js"></script>
<script src="saves.js"></script>
<script src="account.js"></script>
<script>
  var grid = document.getElementById("grid");
  var games = window.GAMES || [];

  // Card layout experiments. Blurbs stay in games.js either way.
  var SHOW_BLURBS = false;      // the one-line description under the title
  var SHOW_TITLE_UNDER = false; // the title under the picture area (which already shows it)

  // The card's picture area shows the game's name.
  function placeholder(game) {
    var ph = document.createElement("div");
    ph.className = "ph";
    ph.textContent = game.title;
    return ph;
  }

  // A game nobody has unlocked yet: a "?" instead of its picture and name.
  function lockedCard(game) {
    var a = document.createElement("a");
    a.className = "card locked";
    a.href = "play.html?game=" + encodeURIComponent(game.id);
    a.setAttribute("aria-label", "Locked game. Open it and press Play to unlock it.");
    var thumb = document.createElement("div");
    thumb.className = "thumb";
    var q = document.createElement("div");
    q.className = "ph mystery";
    q.textContent = "?";
    thumb.appendChild(q);
    var info = document.createElement("div");
    info.className = "info";
    if (SHOW_TITLE_UNDER) {
      var h2 = document.createElement("h2");
      h2.textContent = "???";
      info.append(h2);
    }
    if (SHOW_BLURBS) {
      var p = document.createElement("p");
      p.textContent = "Press Play to unlock.";
      info.append(p);
    }
    a.append(thumb, info);
    return a;
  }

  function card(game) {
    var a = document.createElement("a");
    a.className = "card";
    a.href = "play.html?game=" + encodeURIComponent(game.id);

    var thumb = document.createElement("div");
    thumb.className = "thumb";
    thumb.appendChild(placeholder(game));

    var info = document.createElement("div");
    info.className = "info";
    info.dataset.game = game.id;
    if (SHOW_TITLE_UNDER) {
      var h2 = document.createElement("h2");
      h2.textContent = game.title;
      info.appendChild(h2);
    }
    if (SHOW_BLURBS && game.blurb) {
      var p = document.createElement("p");
      p.textContent = game.blurb;
      info.appendChild(p);
    }

    a.appendChild(thumb);
    a.appendChild(info);
    return a;
  }

  // A copy of the list in random order (Fisher-Yates shuffle).
  function shuffled(list) {
    var out = list.slice();
    for (var i = out.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  // This person's random game order: shuffled once per log-in, then kept
  // until they next log in (login.html and join.html clear it). Games added
  // to games.js since then go in at random spots; removed ones drop out.
  function loginOrder(orderKey) {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(orderKey)); } catch (e) {}
    var byId = {};
    games.forEach(function (g) { byId[g.id] = g; });
    var out = [];
    if (Array.isArray(saved)) {
      saved.forEach(function (id) {
        if (byId[id]) { out.push(byId[id]); delete byId[id]; }
      });
    }
    shuffled(Object.keys(byId)).forEach(function (id) {
      out.splice(Math.floor(Math.random() * (out.length + 1)), 0, byId[id]);
    });
    try { localStorage.setItem(orderKey, JSON.stringify(out.map(function (g) { return g.id; }))); } catch (e) {}
    return out;
  }

  // unlocked: the set of game ids this person has unlocked, or null for all
  // (admins, or no server, e.g. GitHub Pages). Standard (non-admin) accounts
  // get their per-log-in random order (orderKey); admins and the no-server
  // copy keep the games.js order. Games unlocked since the last
  // visit get a reveal animation; "seen" remembers which were already shown.
  function render(unlocked, seenKey, orderKey) {
    var seen = {};
    try { seen = JSON.parse(localStorage.getItem(seenKey) || "{}"); } catch (e) {}
    var count = 0;
    (unlocked && orderKey ? loginOrder(orderKey) : games).forEach(function (game) {
      var open = !unlocked || unlocked[game.id];
      var li = document.createElement("li");
      var a = open ? card(game) : lockedCard(game);
      if (open) count++;
      if (open && unlocked && seenKey && !seen[game.id]) {
        a.classList.add("just-unlocked");
        seen[game.id] = 1;
      }
      li.appendChild(a);
      grid.appendChild(li);
    });
    if (seenKey) localStorage.setItem(seenKey, JSON.stringify(seen));
    if (unlocked) {
      var tally = document.getElementById("unlock-count");
      tally.textContent = count + " of " + games.length + " games unlocked";
      tally.hidden = false;
    }
    if (!games.length) document.getElementById("empty").hidden = false;
    loadRatings();
  }

  // Ask the server what's unlocked before drawing anything, so locked games'
  // pictures never flash up. No answer in 4 s, or no server: show everything.
  var drawn = false;
  function draw(unlocked, seenKey, orderKey) {
    if (drawn) return;
    drawn = true;
    render(unlocked, seenKey, orderKey);
  }
  // Mature games (games.js `mature: N`) only show once the server says this
  // person's grade allows them; without an answer they stay off the page.
  function withoutMature() {
    if (!drawn) games = games.filter(function (g) { return !g.mature; });
  }
  setTimeout(function () { withoutMature(); draw(null); }, 4000);
  fetch("/api/unlocks", { credentials: "same-origin" })
    .then(function (res) {
      var type = res.headers.get("Content-Type") || "";
      return res.ok && type.indexOf("application/json") !== -1 ? res.json() : null;
    })
    .then(function (data) {
      if (data && data.all) return draw(null); // admins: everything, open
      if (!data) { withoutMature(); return draw(null); }
      // Mature games: open if the grade allows, left out entirely if not.
      var blocked = {};
      (data.blocked || []).forEach(function (id) { blocked[id] = true; });
      if (!drawn) games = games.filter(function (g) { return !blocked[g.id]; });
      var set = {};
      data.unlocked.concat(data.open || []).forEach(function (id) { set[id] = true; });
      draw(set, "ce-unlocks-seen:" + data.user, "ce-game-order:" + data.user);
    })
    .catch(function () { withoutMature(); draw(null); });

  // Average ratings from the comments server, if it's running. Locked cards
  // have no data-game, so they never show one.
  function loadRatings() {
    fetch("/api/ratings", { credentials: "same-origin" })
      .then(function (res) {
        var type = res.headers.get("Content-Type") || "";
        return res.ok && type.indexOf("application/json") !== -1 ? res.json() : null;
      })
      .then(function (data) {
        if (!data) return;
        Object.keys(data.ratings).forEach(function (id) {
          var info = grid.querySelector('.info[data-game="' + id + '"]');
          if (!info) return;
          var r = data.ratings[id];
          var p = document.createElement("p");
          p.className = "rating";
          p.textContent = "★ " + r.avg.toFixed(1) + " (" + r.count + ")";
          p.setAttribute("aria-label", "Rated " + r.avg.toFixed(1) + " out of 5 by " + r.count);
          info.appendChild(p);
        });
      })
      .catch(function () { /* no server: no ratings shown */ });
  }
</script>
</body>
</html>
