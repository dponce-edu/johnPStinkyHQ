<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Player</title>
<style>
  :root {
    --page: #e4e8f0;
    --ink: #1c2233;
    --muted: #5a6378;
    --bezel: #c9cfdc;
    --screen: #111522;
    --accent: #2f4bff;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #181c28;
      --ink: #e8ebf4;
      --muted: #98a0b5;
      --bezel: #2a3042;
      --screen: #0b0d15;
      --accent: #7f93ff;
      --accent-ink: #10132a;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 16px/1.5 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
  }

  header { width: 100%; max-width: 820px; margin-bottom: 1.25rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }

  .bezel {
    width: 100%;
    max-width: 820px;
    background: var(--bezel);
    padding: 10px;
    border-radius: 14px;
  }
  #stage {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--screen);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  #stage ruffle-player { width: 100%; height: 100%; display: block; }

  #message {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    text-align: center;
    color: #c8cee0;
  }
  #message[hidden] { display: none; }

  .controls {
    width: 100%;
    max-width: 820px;
    display: flex;
    flex-wrap: wrap;
    gap: .75rem;
    align-items: center;
    margin-top: 1rem;
  }
  button, label.file {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 8px;
    padding: .6rem 1rem;
    cursor: pointer;
  }
  button.quiet {
    background: transparent;
    color: var(--ink);
    box-shadow: inset 0 0 0 2px var(--bezel);
  }
  button:focus-visible, label.file:focus-within {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
  input[type="file"] { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #name { color: var(--muted); font-size: .95rem; overflow-wrap: anywhere; }
</style>
</head>
<body>

<header>
  <h1>Flash Player</h1>
  <p>Plays Flash (.swf) files in your browser using Ruffle.</p>
</header>

<main class="bezel">
  <div id="stage">
    <div id="message">Loading player…</div>
  </div>
</main>

<div class="controls">
  <label class="file">
    Open a .swf file
    <input id="picker" type="file" accept=".swf,application/x-shockwave-flash">
  </label>
  <button id="reload" class="quiet" type="button">Restart</button>
  <button id="full" class="quiet" type="button">Full screen</button>
  <span id="name"></span>
</div>

<!-- Ruffle: loads from a CDN. To host it yourself, download a release from
     https://ruffle.rs/downloads and point this src at the local ruffle.js -->
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
  // Put your game in the same repo folder and set its file name here.
  // Set to "" to start with an empty player and only use "Open a .swf file".
  var DEFAULT_SWF = "game.swf";

  var stage = document.getElementById("stage");
  var message = document.getElementById("message");
  var nameEl = document.getElementById("name");
  var player = null;
  var last = null; // what to reload: { url } or { data }

  function show(text) { message.textContent = text; message.hidden = false; }
  function hideMessage() { message.hidden = true; }

  function ensurePlayer() {
    if (player) return player;
    var ruffle = window.RufflePlayer.newest();
    player = ruffle.createPlayer();
    stage.appendChild(player);
    return player;
  }

  function play(source, label) {
    if (!window.RufflePlayer) {
      show("Ruffle could not be loaded. Check your internet connection and reload the page.");
      return;
    }
    last = { source: source, label: label };
    nameEl.textContent = label;
    hideMessage();
    var p = ensurePlayer();
    var result = p.load(source);
    if (result && result.catch) {
      result.catch(function (err) {
        console.error(err);
        show("Couldn't load " + label + ". Make sure the file exists and is a valid .swf.");
      });
    }
  }

  function playUrl(url) { play({ url: url }, url); }

  document.getElementById("picker").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      play({ data: new Uint8Array(reader.result) }, file.name);
    };
    reader.readAsArrayBuffer(file);
  });

  document.getElementById("reload").addEventListener("click", function () {
    if (last) play(last.source, last.label);
  });

  document.getElementById("full").addEventListener("click", function () {
    if (player && player.enterFullscreen) player.enterFullscreen();
    else if (stage.requestFullscreen) stage.requestFullscreen();
  });

  window.addEventListener("load", function () {
    if (DEFAULT_SWF) playUrl(DEFAULT_SWF);
    else show("Choose a .swf file to play it.");
  });
</script>
</body>
</html>
