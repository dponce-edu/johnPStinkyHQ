<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Club Escapade</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- The one page anyone can see. Everything else on the Pi needs a log-in
     (see server/Caddyfile). Only styles.css and background.jpg load here. -->
<div class="wrap">
  <header>
    <h1>Club Escapade</h1>
    <p>Log in to play.</p>
  </header>

  <main class="login">
    <form id="login" class="pin-login" novalidate>
      <label for="name">Username</label>
      <input id="name" type="text" autocomplete="username" autocapitalize="off"
             spellcheck="false" maxlength="20" required autofocus>

      <label for="pin">PIN</label>
      <!-- inputmode="none": on touch screens use the number pad below instead
           of the pop-up keyboard. A real keyboard still types into it. -->
      <input id="pin" class="pin-input" type="password" inputmode="none"
             autocomplete="current-password" maxlength="6" placeholder="••••••">

      <div class="keypad" role="group" aria-label="Number pad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="clear" class="quiet" aria-label="Clear PIN">Clear</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="back" class="quiet" aria-label="Delete last digit">&#9003;</button>
      </div>
      <p class="muted auth-note">No account? Ask your teacher for one.</p>
    </form>
    <p id="msg" class="muted" role="status" aria-live="polite"></p>
  </main>
</div>

<script>
  // Type a username, then the PIN with the number pad or the keyboard
  // (digits, Backspace, Esc to clear). The last digit logs in.
  var PIN_LENGTH = 6; // keep in step with PIN_LENGTH in server/app.py
  var form = document.getElementById("login");
  var nameEl = document.getElementById("name");
  var pinEl = document.getElementById("pin");
  var msg = document.getElementById("msg");
  var keypad = form.querySelector(".keypad");
  var busy = false;

  // Go back to the page that sent us here, but only to a page on this site.
  function next() {
    var n = new URLSearchParams(location.search).get("next") || "/";
    return /^\/(?![\/\\])/.test(n) ? n : "/";
  }

  function json(res) {
    var type = res.headers.get("Content-Type") || "";
    if (type.indexOf("application/json") === -1) throw new Error("The server isn't reachable.");
    return res.json().then(function (data) {
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    });
  }

  // Already logged in (e.g. pressed Back): skip the form.
  fetch("/api/me", { credentials: "same-origin" }).then(json).then(function (data) {
    if (data.user) location.replace(next());
  }).catch(function () {});

  // Light up the on-screen key a keyboard press matches.
  function flash(key) {
    var b = keypad.querySelector('[data-key="' + key + '"]');
    if (!b) return;
    b.classList.add("pressed");
    setTimeout(function () { b.classList.remove("pressed"); }, 120);
  }

  function setPin(value) {
    pinEl.value = value.replace(/\D/g, "").slice(0, PIN_LENGTH);
    if (pinEl.value.length === PIN_LENGTH) submit();
  }

  function press(key) {
    if (busy) return;
    if (key === "clear") setPin("");
    else if (key === "back") setPin(pinEl.value.slice(0, -1));
    else setPin(pinEl.value + key);
  }

  function submit() {
    if (busy) return;
    var name = nameEl.value.trim();
    if (!name) {
      msg.textContent = "Type your username first.";
      pinEl.value = "";
      nameEl.focus();
      return;
    }
    if (pinEl.value.length !== PIN_LENGTH) {
      msg.textContent = "Your PIN is " + PIN_LENGTH + " digits.";
      return;
    }
    busy = true;
    form.classList.add("busy");
    msg.textContent = "Logging in…";
    fetch("/api/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: name, pin: pinEl.value })
    }).then(json).then(function () {
      location.replace(next());
    }).catch(function (err) {
      msg.textContent = err.message;
      busy = false;
      form.classList.remove("busy");
      pinEl.value = "";
      form.classList.remove("shake");
      void form.offsetWidth; // restart the animation
      form.classList.add("shake");
      pinEl.focus();
    });
  }

  keypad.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-key]");
    if (b) press(b.dataset.key);
  });

  // Typing straight into the PIN box: keep digits only.
  pinEl.addEventListener("input", function () { setPin(pinEl.value); });

  // Enter in the username box moves on to the PIN.
  nameEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); pinEl.focus(); }
  });

  form.addEventListener("submit", function (e) { e.preventDefault(); submit(); });

  // Keyboard anywhere except the username box (which can hold digits too):
  // digits, Backspace and Esc work the number pad, and Enter logs in.
  document.addEventListener("keydown", function (e) {
    if (e.target === nameEl || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "Enter") { // no submit button, so the form won't do this itself
      e.preventDefault();
      submit();
      return;
    }
    var key = /^[0-9]$/.test(e.key) ? e.key
            : e.key === "Backspace" ? "back"
            : e.key === "Escape" ? "clear"
            : null;
    if (!key) return;
    flash(key);
    if (e.target === pinEl && key !== "clear") return; // the box handles its own typing
    e.preventDefault();
    press(key);
    pinEl.focus();
  });
</script>
</body>
</html>
