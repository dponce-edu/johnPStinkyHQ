<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Club Escapade</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Title bar across the top of every page: site name on the left;
     account.js adds the name / Log out box on the right. -->
<header class="site-bar">
  <a class="site-name" href="index.html">Club Escapade</a>
</header>

<!-- Anyone can see this page (and join.html). Everything else on the Pi needs
     a log-in (see server/Caddyfile and PUBLIC_PATHS in server/app.py). -->
<div class="wrap">
  <main class="login">
    <form id="login" class="pin-login" novalidate>
      <label for="name">Username</label>
      <input id="name" type="text" autocomplete="username" autocapitalize="off"
             spellcheck="false" maxlength="20" required autofocus>

      <label for="pin">PIN</label>
      <!-- inputmode="none": on touch screens use the number pad below instead
           of the pop-up keyboard. A real keyboard still types into it. -->
      <input id="pin" class="pin-input" type="password" inputmode="none"
             autocomplete="current-password">
      <div id="keypad"></div>

      <p class="muted auth-note">New here? <a href="join.html">Use your invite code</a>.</p>
    </form>
    <p id="msg" class="muted" role="status" aria-live="polite"></p>
  </main>
</div>

<script src="pinpad.js"></script>
<script>
  // A new log-in gets a new random game order on the homepage (index.html).
  try {
    Object.keys(localStorage).forEach(function (k) {
      if (k.indexOf("ce-game-order:") === 0) localStorage.removeItem(k);
    });
  } catch (e) {}
  // Type the username (from the teacher), then the PIN with the number pad or the keyboard.
  // The last digit logs in.
  var form = document.getElementById("login");
  var nameEl = document.getElementById("name");
  var pinEl = document.getElementById("pin");
  var msg = document.getElementById("msg");
  var busy = false;

  pinEl.maxLength = PIN_LENGTH;
  pinEl.placeholder = "•".repeat(PIN_LENGTH);

  // Go back to the page that sent us here, but only to a page on this site.
  // Admins headed for the homepage land on the admin tools instead.
  function next(user) {
    var n = new URLSearchParams(location.search).get("next") || "/";
    if (!/^\/(?![\/\\])/.test(n)) n = "/";
    if (user && user.admin && (n === "/" || n === "/index.html")) n = "/admin.html";
    return n;
  }

  function json(res) {
    var type = res.headers.get("Content-Type") || "";
    if (type.indexOf("application/json") === -1) throw new Error("The server isn't reachable.");
    return res.json().then(function (data) {
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    });
  }

  // Already logged in (e.g. pressed Back): skip the form.
  fetch("/api/me", { credentials: "same-origin" }).then(json).then(function (data) {
    if (data.user) location.replace(next(data.user));
  }).catch(function () {});

  var pad = PinPad({
    input: pinEl,
    keypad: document.getElementById("keypad"),
    length: PIN_LENGTH,
    onComplete: submit,
    onEnter: submit,
    busy: function () { return busy; }
  });

  function submit() {
    if (busy) return;
    var name = nameEl.value.trim();
    if (!name) {
      msg.textContent = "Type your username first.";
      pad.clear();
      nameEl.focus();
      return;
    }
    if (pad.value().length !== PIN_LENGTH) {
      msg.textContent = "Your PIN is " + PIN_LENGTH + " digits.";
      return;
    }
    busy = true;
    form.classList.add("busy");
    msg.textContent = "Logging in…";
    fetch("/api/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: name, pin: pad.value() })
    }).then(json).then(function (data) {
      location.replace(next(data.user));
    }).catch(function (err) {
      msg.textContent = err.message;
      busy = false;
      form.classList.remove("busy");
      pad.clear();
      form.classList.remove("shake");
      void form.offsetWidth; // restart the animation
      form.classList.add("shake");
      pad.focus();
    });
  }

  // Enter in the username box moves on to the PIN.
  nameEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); pad.focus(); }
  });
  form.addEventListener("submit", function (e) { e.preventDefault(); submit(); });
</script>
</body>
</html>
