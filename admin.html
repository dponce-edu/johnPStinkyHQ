<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin tools · Club Escapade</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Admin tools. Anyone logged in can load this page, but every request it
     makes is refused by the server unless the account is an admin. -->
<div class="wrap">
  <div class="topbar">
    <h1>Admin tools</h1>
    <a class="back" href="index.html">&larr; All games</a>
  </div>

  <main class="admin">
    <p id="status" class="muted" role="status" aria-live="polite">Loading…</p>

    <div id="tools" hidden>
      <section>
        <h2>Reported comments</h2>
        <ul id="reports" class="comments"></ul>
      </section>

      <section>
        <h2>Time out a student</h2>
        <p class="muted">They're logged out right away and can't use the site until it ends.</p>
        <form id="timeout-form" class="timeout-form">
          <label for="to-user">Student</label>
          <select id="to-user" required></select>
          <label for="to-length">For</label>
          <select id="to-length"></select>
          <button type="submit">Time out</button>
        </form>

        <h3>Timed out now</h3>
        <ul id="timeouts" class="comments"></ul>
      </section>
    </div>
  </main>
</div>

<script src="games.js"></script>
<script>
(function () {
  var statusEl = document.getElementById("status");
  var tools = document.getElementById("tools");
  var reportsEl = document.getElementById("reports");
  var timeoutsEl = document.getElementById("timeouts");
  var form = document.getElementById("timeout-form");
  var userSel = document.getElementById("to-user");
  var lengthSel = document.getElementById("to-length");

  var titles = {};
  (window.GAMES || []).forEach(function (g) { titles[g.id] = g.title; });

  function api(method, path, body) {
    var opts = { method: method, credentials: "same-origin", headers: {} };
    if (method !== "GET") {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body || {});
    }
    return fetch(path, opts).then(function (res) {
      var type = res.headers.get("Content-Type") || "";
      if (type.indexOf("application/json") === -1) throw new Error("The server isn't reachable.");
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || "Something went wrong.");
        return data;
      });
    });
  }

  function say(text) { statusEl.textContent = text || ""; }
  function fail(err) { say(err.message); }

  function ago(seconds) {
    var s = Math.max(0, Date.now() / 1000 - seconds);
    if (s < 60) return "just now";
    var units = [[86400 * 365, "year"], [86400 * 30, "month"], [86400, "day"], [3600, "hour"], [60, "minute"]];
    for (var i = 0; i < units.length; i++) {
      var n = Math.floor(s / units[i][0]);
      if (n >= 1) return n + " " + units[i][1] + (n > 1 ? "s" : "") + " ago";
    }
    return "just now";
  }

  function lengthLabel(minutes) {
    if (minutes % 10080 === 0) return plural(minutes / 10080, "week");
    if (minutes % 1440 === 0) return plural(minutes / 1440, "day");
    if (minutes % 60 === 0) return plural(minutes / 60, "hour");
    return plural(minutes, "minute");
  }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  function linkButton(text, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "link";
    b.textContent = text;
    b.addEventListener("click", function () { onClick(b); });
    return b;
  }

  // First click asks "Sure?", a second click within 4 seconds does it.
  function twoStep(button, question, action) {
    if (button.dataset.armed) { button.disabled = true; action(); return; }
    var text = button.textContent;
    button.dataset.armed = "1";
    button.textContent = question;
    setTimeout(function () {
      if (!button.isConnected || button.disabled) return;
      delete button.dataset.armed;
      button.textContent = text;
    }, 4000);
  }

  // ---- reported comments

  function loadReports() {
    return api("GET", "/api/admin/reports").then(function (data) {
      reportsEl.replaceChildren();
      if (!data.comments.length) {
        var none = document.createElement("li");
        none.className = "empty";
        none.textContent = "No reported comments. All clear!";
        reportsEl.append(none);
        return;
      }
      data.comments.forEach(function (c) {
        var li = document.createElement("li");

        var meta = document.createElement("p");
        meta.className = "meta";
        var game = document.createElement("a");
        game.href = "play.html?game=" + encodeURIComponent(c.game);
        game.textContent = titles[c.game] || c.game;
        var who = document.createElement("strong");
        who.textContent = c.user;
        var flag = document.createElement("span");
        flag.className = "flagged";
        flag.textContent = "⚑ " + plural(c.reports, "report");
        meta.append(game, " · ", who, " · " + ago(c.created) + " · ", flag);
        if (c.banned) meta.append(" · banned");
        else if (c.timeoutUntil) meta.append(" · timed out");

        var body = document.createElement("p");
        body.className = "body";
        body.textContent = c.body; // plain text only, never HTML

        var actions = document.createElement("p");
        actions.className = "actions";
        actions.append(
          linkButton("Delete comment", function (b) {
            twoStep(b, "Really delete?", function () {
              api("DELETE", "/api/comments/" + c.id).then(function () {
                say("Comment deleted.");
                return loadReports();
              }).catch(fail);
            });
          }), " · ",
          linkButton("Dismiss reports", function (b) {
            twoStep(b, "Keep the comment?", function () {
              api("POST", "/api/admin/comments/" + c.id + "/clear-reports").then(function () {
                say("Reports dismissed. The comment stays up.");
                return loadReports();
              }).catch(fail);
            });
          }), " · ",
          linkButton("Time out " + c.user, function () {
            userSel.value = c.user;
            form.scrollIntoView({ behavior: "smooth", block: "center" });
            lengthSel.focus();
          })
        );

        li.append(meta, body, actions);
        reportsEl.append(li);
      });
    });
  }

  // ---- timeouts

  function loadUsers() {
    return api("GET", "/api/admin/users").then(function (data) {
      var keep = userSel.value;
      userSel.replaceChildren(new Option("Pick a student", ""));
      data.users.forEach(function (u) {
        if (!u.admin) userSel.append(new Option(u.name, u.name));
      });
      userSel.value = keep;

      if (!lengthSel.options.length) {
        data.choices.forEach(function (m) { lengthSel.append(new Option(lengthLabel(m), m)); });
      }

      timeoutsEl.replaceChildren();
      var out = data.users.filter(function (u) { return u.timeoutUntil; });
      if (!out.length) {
        var none = document.createElement("li");
        none.className = "empty";
        none.textContent = "Nobody.";
        timeoutsEl.append(none);
      }
      out.forEach(function (u) {
        var li = document.createElement("li");
        var p = document.createElement("p");
        p.className = "meta";
        var who = document.createElement("strong");
        who.textContent = u.name;
        p.append(who, " · until " + u.until + " · ",
          linkButton("End now", function (b) {
            b.disabled = true;
            setTimeoutFor(u.name, 0);
          }));
        li.append(p);
        timeoutsEl.append(li);
      });
    });
  }

  function setTimeoutFor(name, minutes) {
    return api("POST", "/api/admin/timeout", { username: name, minutes: minutes }).then(function (r) {
      say(r.until ? r.name + " is timed out until " + r.until + "." : r.name + " can use the site again.");
      return Promise.all([loadUsers(), loadReports()]);
    }).catch(fail);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!userSel.value) { say("Pick a student first."); userSel.focus(); return; }
    var button = form.querySelector("button");
    button.disabled = true;
    setTimeoutFor(userSel.value, Number(lengthSel.value)).then(function () {
      button.disabled = false;
      userSel.value = "";
    });
  });

  // ---- start

  api("GET", "/api/me").then(function (data) {
    if (!data.user || !data.user.admin) {
      say("Admin tools are for admin accounts only.");
      return;
    }
    return Promise.all([loadReports(), loadUsers()]).then(function () {
      say("");
      tools.hidden = false;
    });
  }).catch(fail);
})();
</script>
</body>
</html>
