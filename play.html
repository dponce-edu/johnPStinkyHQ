<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play · Club Escapade</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="play">

<!-- Title bar across the top of every page: site name on the left;
     account.js adds the name / Log out box on the right. -->
<header class="site-bar">
  <a class="site-name" href="index.html">Club Escapade</a>
</header>

<div class="wrap wide">
  <!-- The game on the left, comments and ratings on the right. The game gets
       first claim on the width; comments take what's left. -->
  <div class="play-layout">
  <!-- The game sits in a Windows 95-style window. The title bar shows the
       game's name; its buttons are mute, restart and full screen. -->
  <main class="bezel win95">
    <div class="win95-titlebar">
      <h1 id="title" class="win95-title">Flash Player</h1>
      <div class="win95-buttons">
        <button id="mute" class="win95-btn" type="button" aria-pressed="false" title="Mute" aria-label="Mute">
          <svg class="icon-sound" viewBox="0 0 12 10" aria-hidden="true">
            <path d="M0 3h2l3-3v10L2 7H0z"/>
            <path class="stroke" d="M7 3.5q1 1.5 0 3M9 2q2.2 3 0 6"/>
          </svg>
          <svg class="icon-muted" viewBox="0 0 12 10" aria-hidden="true">
            <path d="M0 3h2l3-3v10L2 7H0z"/>
            <path class="stroke" d="M7.5 2.5l4 5M11.5 2.5l-4 5"/>
          </svg>
        </button>
        <button id="reload" class="win95-btn" type="button" title="Restart" aria-label="Restart">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path class="stroke" d="M8.2 3.2A3.6 3.6 0 1 0 8.6 6.5"/>
            <path d="M6 0.6l3.6 0.4-0.6 3.6z"/>
          </svg>
        </button>
        <button id="full" class="win95-btn" type="button" title="Full screen" aria-label="Full screen">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 0h10v10H0zM1 2v7h8V2z"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="stage">
      <div id="message">Loading player…</div>
    </div>
  </main>

  <div class="play-side">
  <a id="another-game" class="another-game" href="index.html">Another Game?</a>

  <!-- Ratings and comments. Filled in by comments.js; stays hidden when the
       comments server isn't running (e.g. on GitHub Pages). -->
  <section id="community" class="community" hidden>
    <h2>Rating</h2>
    <div id="stars" class="stars" role="group" aria-label="Your rating"></div>
    <p id="rating-summary" class="muted"></p>

    <h2>Comments</h2>
    <div id="account"></div>
    <form id="comment-form" class="comment-form" hidden>
      <label for="comment-body" class="sr-only">Your comment</label>
      <textarea id="comment-body" rows="3" maxlength="1000" placeholder="Say something…" required></textarea>
      <div class="controls">
        <span id="comment-count" class="muted">0 / 1000</span>
        <button type="submit">Post</button>
      </div>
    </form>
    <p id="community-msg" class="muted" role="status" aria-live="polite"></p>
    <ul id="comments" class="comments"></ul>
  </section>
  </div>
  </div>
</div>

<dialog id="confirm-restart">
  <form method="dialog">
    <p>Are you sure you want to restart this game?</p>
    <div class="controls">
      <button value="yes">Restart</button>
      <button value="no" class="quiet" autofocus>Cancel</button>
    </div>
  </form>
</dialog>

<!-- Ruffle: loads from a CDN. To host it yourself, download a release from
     https://ruffle.rs/downloads and point this src at the local ruffle.js -->
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script src="games.js"></script>
<!-- Hidden games: only loads for admins and accounts allowed to see them. -->
<script src="games/hidden/games.js"></script>
<script src="saves.js"></script>
<script src="account.js"></script>
<script src="comments.js" defer></script>
<script>
  var stage = document.getElementById("stage");
  var bezel = document.querySelector(".bezel");
  var message = document.getElementById("message");
  var titleEl = document.getElementById("title");
  var player = null;
  // No right-click menu anywhere on the game.
  stage.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
  var last = null;
  var locked = false; // this person hasn't unlocked this game yet

  function show(html) { message.innerHTML = html; message.hidden = false; }
  function hideMessage() { message.hidden = true; }

  function setTitle(text) {
    titleEl.textContent = text;
    document.title = text + " · Club Escapade";
  }

  // Shape the frame to the game: width / height, e.g. 550 / 400.
  function setRatio(w, h) {
    if (!(w > 0 && h > 0)) return;
    bezel.style.setProperty("--ar", w + " / " + h);
    bezel.style.setProperty("--ar-num", String(w / h));
  }

  function ensurePlayer() {
    if (player) return player;
    player = window.RufflePlayer.newest().createPlayer();
    // Ruffle reads the stage size from the .swf and fires this once it knows it.
    var watching = false;
    player.addEventListener("loadedmetadata", function () {
      var m = player.metadata;
      if (m) setRatio(m.width, m.height);
      // Ruffle's own "write saves on leaving" listener exists by now, so ours
      // runs after it and uploads what it wrote.
      if (!watching && window.cloudSaves) { watching = true; cloudSaves.watchLeaving(); }
    });
    stage.appendChild(player);
    applyMute();
    return player;
  }

  function play(source, label) {
    if (!window.RufflePlayer) {
      show("Ruffle could not be loaded. Check your internet connection and reload the page.");
      return;
    }
    last = { source: source, label: label };
    hideMessage();
    // openUrlMode "deny": stop games from opening links or redirecting the page
    // (Flash getURL / navigateToURL). Use "confirm" to ask the player instead.
    // contextMenu "off": no Ruffle right-click menu (the stage listener above
    // also blocks the browser's own menu).
    // A locked game waits for Ruffle's big Play button; pressing it unlocks.
    var options = Object.assign({ openUrlMode: "deny", contextMenu: "off" }, source,
                                locked ? { autoplay: "off" } : {});
    var result = ensurePlayer().load(options);
    if (locked) watchForPlay();
    if (result && result.catch) {
      result.catch(function (err) {
        console.error(err);
        show("Couldn't load " + label + '. <a href="index.html">Pick another game</a>');
      });
    }
  }

  // Ruffle has no "started playing" event, so check a few times a second
  // until its Play button has been pressed, then unlock the game.
  var playWatch = null;
  function watchForPlay() {
    clearInterval(playWatch); // Restart: only ever one watcher
    var timer = playWatch = setInterval(function () {
      if (!locked) { clearInterval(timer); return; }
      if (!player || !player.isPlaying) return;
      clearInterval(timer);
      fetch("/api/games/" + encodeURIComponent(game.id) + "/unlock", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: "{}"
      }).then(function (res) {
        if (!res.ok) throw new Error("unlock failed: " + res.status);
        locked = false;
        setTitle(game.title);
      }).catch(function (err) {
        console.warn(err);
        setTimeout(watchForPlay, 3000); // try again shortly
      });
    }, 250);
  }

  // Has this person unlocked the game? Without a server (e.g. GitHub Pages)
  // everything counts as unlocked.
  function unlockedHere(gameId) {
    return fetch("/api/unlocks", { credentials: "same-origin" }).then(function (res) {
      var type = res.headers.get("Content-Type") || "";
      return res.ok && type.indexOf("application/json") !== -1 ? res.json() : null;
    }).then(function (data) {
      return !data || data.all || data.unlocked.indexOf(gameId) !== -1;
    }).catch(function () { return true; });
  }

  var id = new URLSearchParams(location.search).get("game");

  // "Another Game?" jumps to a random game other than this one, from every
  // game this person can see (locked ones too: playing one unlocks it).
  // With no other game to pick, it stays a plain link to the homepage.
  document.getElementById("another-game").addEventListener("click", function (e) {
    var others = (window.GAMES || []).filter(function (g) { return g.id !== id; });
    if (!others.length) return;
    e.preventDefault();
    var pick = others[Math.floor(Math.random() * others.length)];
    location.href = "play.html?game=" + encodeURIComponent(pick.id);
  });
  // Admins don't get the button.
  fetch("/api/me", { credentials: "same-origin" }).then(function (res) {
    var type = res.headers.get("Content-Type") || "";
    return res.ok && type.indexOf("application/json") !== -1 ? res.json() : null;
  }).then(function (data) {
    if (data && data.user && data.user.admin) document.getElementById("another-game").hidden = true;
  }).catch(function () {});
  var game = (window.GAMES || []).filter(function (g) { return g.id === id; })[0];

  // Restart asks first. Cancel, Esc or clicking outside the box does nothing.
  var confirmBox = document.getElementById("confirm-restart");
  document.getElementById("reload").addEventListener("click", function () {
    if (!last) return;
    confirmBox.returnValue = "";
    confirmBox.showModal();
  });
  confirmBox.addEventListener("close", function () {
    if (confirmBox.returnValue === "yes" && last) play(last.source, last.label);
  });
  confirmBox.addEventListener("click", function (e) {
    if (e.target === confirmBox) confirmBox.close(); // clicked the dimmed backdrop
  });

  // Mute: remembered across games and visits on this computer.
  var muteBtn = document.getElementById("mute");
  var muted = false;
  try { muted = localStorage.getItem("club-muted") === "1"; } catch (e) {}
  function applyMute() {
    muteBtn.setAttribute("aria-pressed", muted ? "true" : "false");
    muteBtn.title = muted ? "Unmute" : "Mute";
    muteBtn.setAttribute("aria-label", muteBtn.title);
    if (player && "volume" in player) player.volume = muted ? 0 : 1;
  }
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    try { localStorage.setItem("club-muted", muted ? "1" : "0"); } catch (e) {}
    applyMute();
  });
  applyMute();

  document.getElementById("full").addEventListener("click", function () {
    if (player && player.enterFullscreen) player.enterFullscreen();
    else if (stage.requestFullscreen) stage.requestFullscreen();
  });

  window.addEventListener("load", function () {
    if (game) {
      setTitle("???");
      // Optional override from games.js, used until the game reports its own size.
      if (game.ratio) {
        var parts = String(game.ratio).split("/");
        setRatio(parseFloat(parts[0]), parseFloat(parts[1] || 1));
      }
      // Fetch this person's saves from the server first, so the game finds them.
      show("Loading your saves…");
      var ready = Promise.all([
        window.cloudSaves ? cloudSaves.start() : Promise.resolve(),
        unlockedHere(game.id)
      ]);
      ready.then(function (results) {
        locked = !results[1];
        if (!locked) setTitle(game.title);
        // encodeURI handles file names with spaces
        play({ url: encodeURI(game.file) }, game.title);
      });
    } else if (id) {
      show('No game called "' + id.replace(/[<>&"]/g, "") + '". <a href="index.html">See all games</a>');
    } else {
      show('Choose a game from the <a href="index.html">homepage</a>.');
    }
  });
</script>
</body>
</html>
