<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play · Club Escapade</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <h1 id="title">Flash Player</h1>
    <a class="back" href="index.html">&larr; All games</a>
  </div>

  <main class="bezel">
    <div id="stage">
      <div id="message">Loading player…</div>
    </div>
  </main>

  <div class="controls">
    <button id="reload" type="button">Restart</button>
    <button id="full" class="quiet" type="button">Full screen</button>
  </div>

  <!-- Ratings and comments. Filled in by comments.js; stays hidden when the
       comments server isn't running (e.g. on GitHub Pages). -->
  <section id="community" class="community" hidden>
    <h2>Rating</h2>
    <div id="stars" class="stars" role="group" aria-label="Your rating"></div>
    <p id="rating-summary" class="muted"></p>

    <h2>Comments</h2>
    <div id="account"></div>
    <form id="comment-form" class="comment-form" hidden>
      <label for="comment-body" class="sr-only">Your comment</label>
      <textarea id="comment-body" rows="3" maxlength="1000" placeholder="Say something…" required></textarea>
      <div class="controls">
        <span id="comment-count" class="muted">0 / 1000</span>
        <button type="submit">Post</button>
      </div>
    </form>
    <p id="community-msg" class="muted" role="status" aria-live="polite"></p>
    <ul id="comments" class="comments"></ul>
  </section>
</div>

<dialog id="confirm-restart">
  <form method="dialog">
    <p>Are you sure you want to restart this game?</p>
    <div class="controls">
      <button value="yes">Restart</button>
      <button value="no" class="quiet" autofocus>Cancel</button>
    </div>
  </form>
</dialog>

<!-- Ruffle: loads from a CDN. To host it yourself, download a release from
     https://ruffle.rs/downloads and point this src at the local ruffle.js -->
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script src="games.js"></script>
<script src="comments.js" defer></script>
<script>
  var stage = document.getElementById("stage");
  var bezel = document.querySelector(".bezel");
  var message = document.getElementById("message");
  var titleEl = document.getElementById("title");
  var player = null;
  var last = null;

  function show(html) { message.innerHTML = html; message.hidden = false; }
  function hideMessage() { message.hidden = true; }

  function setTitle(text) {
    titleEl.textContent = text;
    document.title = text + " · Club Escapade";
  }

  // Shape the frame to the game: width / height, e.g. 550 / 400.
  function setRatio(w, h) {
    if (!(w > 0 && h > 0)) return;
    bezel.style.setProperty("--ar", w + " / " + h);
    bezel.style.setProperty("--ar-num", String(w / h));
  }

  function ensurePlayer() {
    if (player) return player;
    player = window.RufflePlayer.newest().createPlayer();
    // Ruffle reads the stage size from the .swf and fires this once it knows it.
    player.addEventListener("loadedmetadata", function () {
      var m = player.metadata;
      if (m) setRatio(m.width, m.height);
    });
    stage.appendChild(player);
    return player;
  }

  function play(source, label) {
    if (!window.RufflePlayer) {
      show("Ruffle could not be loaded. Check your internet connection and reload the page.");
      return;
    }
    last = { source: source, label: label };
    hideMessage();
    // openUrlMode "deny": stop games from opening links or redirecting the page
    // (Flash getURL / navigateToURL). Use "confirm" to ask the player instead.
    var options = Object.assign({ openUrlMode: "deny" }, source);
    var result = ensurePlayer().load(options);
    if (result && result.catch) {
      result.catch(function (err) {
        console.error(err);
        show("Couldn't load " + label + '. <a href="index.html">Pick another game</a>');
      });
    }
  }

  var id = new URLSearchParams(location.search).get("game");
  var game = (window.GAMES || []).filter(function (g) { return g.id === id; })[0];

  // Restart asks first. Cancel, Esc or clicking outside the box does nothing.
  var confirmBox = document.getElementById("confirm-restart");
  document.getElementById("reload").addEventListener("click", function () {
    if (!last) return;
    confirmBox.returnValue = "";
    confirmBox.showModal();
  });
  confirmBox.addEventListener("close", function () {
    if (confirmBox.returnValue === "yes" && last) play(last.source, last.label);
  });
  confirmBox.addEventListener("click", function (e) {
    if (e.target === confirmBox) confirmBox.close(); // clicked the dimmed backdrop
  });

  document.getElementById("full").addEventListener("click", function () {
    if (player && player.enterFullscreen) player.enterFullscreen();
    else if (stage.requestFullscreen) stage.requestFullscreen();
  });

  window.addEventListener("load", function () {
    if (game) {
      setTitle(game.title);
      // Optional override from games.js, used until the game reports its own size.
      if (game.ratio) {
        var parts = String(game.ratio).split("/");
        setRatio(parseFloat(parts[0]), parseFloat(parts[1] || 1));
      }
      // encodeURI handles file names with spaces
      play({ url: encodeURI(game.file) }, game.title);
    } else if (id) {
      show('No game called "' + id.replace(/[<>&"]/g, "") + '". <a href="index.html">See all games</a>');
    } else {
      show('Choose a game from the <a href="index.html">homepage</a>.');
    }
  });
</script>
</body>
</html>
