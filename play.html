<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play · Club Escapade</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="play">

<!-- Title bar across the top of every page: site name on the left;
     account.js adds the name / Log out box on the right. -->
<header class="site-bar">
  <a class="site-name" href="index.html">Club Escapade</a>
</header>

<div class="wrap wide">
  <!-- The game on the left, comments and ratings on the right. The game gets
       first claim on the width; comments take what's left. -->
  <div class="play-layout">
  <!-- The game sits in a Windows 95-style window. The title bar shows the
       game's name; its buttons are mute and restart (full screen is there
       but hidden). -->
  <main class="bezel win95">
    <div class="win95-titlebar">
      <h1 id="title" class="win95-title">Flash Player</h1>
      <div class="win95-buttons">
        <button id="mute" class="win95-btn" type="button" aria-pressed="false" title="Mute" aria-label="Mute">
          <svg class="icon-sound" viewBox="0 0 12 10" aria-hidden="true">
            <path d="M0 3h2l3-3v10L2 7H0z"/>
            <path class="stroke" d="M7 3.5q1 1.5 0 3M9 2q2.2 3 0 6"/>
          </svg>
          <svg class="icon-muted" viewBox="0 0 12 10" aria-hidden="true">
            <path d="M0 3h2l3-3v10L2 7H0z"/>
            <path class="stroke" d="M7.5 2.5l4 5M11.5 2.5l-4 5"/>
          </svg>
        </button>
        <button id="reload" class="win95-btn" type="button" title="Restart" aria-label="Restart">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path class="stroke" d="M8.2 3.2A3.6 3.6 0 1 0 8.6 6.5"/>
            <path d="M6 0.6l3.6 0.4-0.6 3.6z"/>
          </svg>
        </button>
        <!-- Full screen: switched off for now. Remove "hidden" to bring it back;
             its code below still works. -->
        <button id="full" class="win95-btn" type="button" title="Full screen" aria-label="Full screen" hidden>
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 0h10v10H0zM1 2v7h8V2z"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="stage">
      <div id="message">Loading player…</div>
    </div>
  </main>

  <div class="play-side">
  <a id="another-game" class="another-game" href="index.html">Another Game?</a>

  <!-- Ratings and comments. Filled in by comments.js; stays hidden when the
       comments server isn't running (e.g. on GitHub Pages). -->
  <section id="community" class="community" hidden>
    <h2>Rating</h2>
    <div id="stars" class="stars" role="group" aria-label="Your rating"></div>
    <p id="rating-summary" class="muted"></p>

    <h2>Comments</h2>
    <div id="account"></div>
    <form id="comment-form" class="comment-form" hidden>
      <label for="comment-body" class="sr-only">Your comment</label>
      <textarea id="comment-body" rows="3" maxlength="1000" placeholder="Say something…" required></textarea>
      <div class="controls">
        <span id="comment-count" class="muted">0 / 1000</span>
        <button type="submit">Post</button>
      </div>
    </form>
    <p id="community-msg" class="muted" role="status" aria-live="polite"></p>
    <ul id="comments" class="comments"></ul>
  </section>
  </div>
  </div>
</div>

<!-- Shown on the "Another Game?" press that reveals a hidden game. -->
<dialog id="hidden-found" class="hidden-found">
  <form method="dialog">
    <p class="hidden-found-title">Wait... a hidden game?</p>
    <div class="controls">
      <button value="go" autofocus>Go</button>
    </div>
  </form>
</dialog>

<dialog id="confirm-restart">
  <form method="dialog">
    <p>Are you sure you want to restart this game?</p>
    <div class="controls">
      <button value="yes">Restart</button>
      <button value="no" class="quiet" autofocus>Cancel</button>
    </div>
  </form>
</dialog>

<!-- Ruffle: loads from a CDN. To host it yourself, download a release from
     https://ruffle.rs/downloads and point this src at the local ruffle.js -->
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script src="games.js"></script>
<!-- Hidden games: only loads for admins and accounts allowed to see them. -->
<script src="games/hidden/games.js"></script>
<script src="saves.js"></script>
<script src="account.js"></script>
<script src="comments.js" defer></script>
<script>
  var stage = document.getElementById("stage");
  var bezel = document.querySelector(".bezel");
  var message = document.getElementById("message");
  var titleEl = document.getElementById("title");
  var player = null;
  // No right-click menu anywhere on the game.
  stage.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
  var last = null;
  var locked = false; // this person hasn't unlocked this game yet

  function show(html) { message.innerHTML = html; message.hidden = false; }
  function hideMessage() { message.hidden = true; }

  function setTitle(text) {
    titleEl.textContent = text;
    document.title = text + " · Club Escapade";
  }

  // Shape the frame to the game: width / height, e.g. 550 / 400.
  function setRatio(w, h) {
    if (!(w > 0 && h > 0)) return;
    bezel.style.setProperty("--ar", w + " / " + h);
    bezel.style.setProperty("--ar-num", String(w / h));
  }

  // The game's stage size, read from the start of its .swf file before the
  // game runs. Some games (Red Ball 2, 3) turn Flash scaling off and measure
  // the screen as they start, so the window must already be the right shape:
  // resizing it once they're running leaves them broken until a restart.
  // Resolves {w, h}, or null if it can't tell (then the size comes from
  // Ruffle once the game loads, as before).
  function swfSize(url) {
    var reader = null;
    function bytes(min) { // at least `min` bytes from the start of the file
      var parts = [], have = 0;
      function more() {
        if (have >= min) return Promise.resolve(join(parts, have));
        return reader.read().then(function (r) {
          if (r.done) return join(parts, have);
          parts.push(r.value); have += r.value.length;
          return more();
        });
      }
      return more();
    }
    function join(parts, n) {
      var out = new Uint8Array(n), at = 0;
      parts.forEach(function (p) { out.set(p, at); at += p.length; });
      return out;
    }
    function inflate(data) { // zlib data -> its first 32 bytes
      var ds = new DecompressionStream("deflate");
      var w = ds.writable.getWriter();
      // Not closed: this is only the start of the file, and closing would make
      // some browsers throw away what was already unpacked.
      w.write(data).catch(function () {});
      var r = ds.readable.getReader(), parts = [], have = 0;
      function more() {
        if (have >= 32) { r.cancel().catch(function () {}); return join(parts, have); }
        return r.read().then(function (x) {
          if (x.done) return join(parts, have);
          parts.push(x.value); have += x.value.length;
          return more();
        });
      }
      return more();
    }
    function rect(b) { // SWF RECT: 5-bit size, then xmin, xmax, ymin, ymax (twips)
      var n = b[0] >> 3, pos = 5;
      function bits(count) {
        var v = 0;
        for (var i = 0; i < count; i++, pos++) v = v * 2 + ((b[pos >> 3] >> (7 - (pos & 7))) & 1);
        return v;
      }
      var x0 = bits(n), x1 = bits(n), y0 = bits(n), y1 = bits(n);
      return { w: (x1 - x0) / 20, h: (y1 - y0) / 20 };
    }
    return fetch(url, { credentials: "same-origin" }).then(function (res) {
      if (!res.ok || !res.body) return null;
      reader = res.body.getReader();
      return bytes(4096).then(function (head) {
        reader.cancel().catch(function () {}); // the rest isn't needed here
        var sig = String.fromCharCode(head[0], head[1], head[2]);
        if (sig === "FWS") return rect(head.subarray(8));
        if (sig === "CWS" && window.DecompressionStream) return inflate(head.subarray(8)).then(rect);
        return null; // LZMA-compressed (ZWS) or not a Flash file
      });
    }).then(function (size) {
      return size && size.w > 0 && size.h > 0 ? size : null;
    }).catch(function () { return null; });
  }

  // Shape the window to the game before it starts, with no slide animation.
  function sizeBeforeStart(game) {
    if (game.ratio) return Promise.resolve(); // games.js already gave a shape
    var waited = new Promise(function (done) { setTimeout(done, 2000); });
    return Promise.race([swfSize(encodeURI(game.file)), waited]).then(function (size) {
      if (!size) return;
      bezel.style.transition = "none";
      setRatio(size.w, size.h);
      void bezel.offsetWidth; // apply now
      bezel.style.transition = "";
    });
  }

  // games.js `urlRewrite`: [[pattern, "/site/path"], ...]. Ruffle sends any
  // request the game makes whose address matches a pattern to that file on
  // this site instead (game-stubs/), so calls to long-gone outside services
  // get the same quick answer every time.
  function rewriteRules(game) {
    return game.urlRewrite.map(function (rule) {
      return [new RegExp(rule[0]), location.origin + rule[1]];
    });
  }

  function ensurePlayer() {
    if (player) return player;
    player = window.RufflePlayer.newest().createPlayer();
    // Ruffle reads the stage size from the .swf and fires this once it knows it.
    var watching = false;
    player.addEventListener("loadedmetadata", function () {
      var m = player.metadata;
      if (m) setRatio(m.width, m.height);
      // Ruffle's own "write saves on leaving" listener exists by now, so ours
      // runs after it and uploads what it wrote.
      if (!watching && window.cloudSaves) { watching = true; cloudSaves.watchLeaving(); }
    });
    stage.appendChild(player);
    applyMute();
    return player;
  }

  function play(source, label) {
    if (!window.RufflePlayer) {
      show("Ruffle could not be loaded. Check your internet connection and reload the page.");
      return;
    }
    last = { source: source, label: label };
    hideMessage();
    // openUrlMode "deny": stop games from opening links or redirecting the page
    // (Flash getURL / navigateToURL). Use "confirm" to ask the player instead.
    // contextMenu "off": no Ruffle right-click menu (the stage listener above
    // also blocks the browser's own menu).
    // A locked game waits for Ruffle's big Play button; pressing it unlocks.
    // quality: a game's own setting from games.js (lower runs faster).
    var options = Object.assign({ openUrlMode: "deny", contextMenu: "off" }, source,
                                game && game.quality ? { quality: game.quality } : {},
                                game && game.urlRewrite ? { urlRewriteRules: rewriteRules(game) } : {},
                                locked ? { autoplay: "off" } : {});
    var result = ensurePlayer().load(options);
    if (locked) watchForPlay();
    if (game && game.restartOnLoad && !restartedOnce) restartOnceRunning();
    if (result && result.catch) {
      result.catch(function (err) {
        console.error(err);
        show("Couldn't load " + label + '. <a href="index.html">Pick another game</a>');
      });
    }
  }

  // games.js `restartOnLoad: true`: for a game that breaks the first time it
  // starts on a page but reliably works after our Restart button (Red Ball 2:
  // it reads the stage size the instant it starts, while a brand-new Ruffle
  // player is still getting going). Once it's actually running (after Play,
  // for a locked game), restart it once, the same as pressing Restart.
  var restartedOnce = false, restartWatch = null;
  function restartOnceRunning() {
    clearInterval(restartWatch);
    restartWatch = setInterval(function () {
      if (restartedOnce) { clearInterval(restartWatch); return; }
      if (!player || !player.isPlaying) return;
      clearInterval(restartWatch);
      setTimeout(function () {
        if (restartedOnce || !last) return;
        restartedOnce = true;
        play(last.source, last.label);
      }, 800);
    }, 250);
  }

  // Ruffle has no "started playing" event, so check a few times a second
  // until its Play button has been pressed, then unlock the game.
  var playWatch = null;
  function watchForPlay() {
    clearInterval(playWatch); // Restart: only ever one watcher
    var timer = playWatch = setInterval(function () {
      if (!locked) { clearInterval(timer); return; }
      if (!player || !player.isPlaying) return;
      clearInterval(timer);
      fetch("/api/games/" + encodeURIComponent(game.id) + "/unlock", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: "{}"
      }).then(function (res) {
        if (!res.ok) throw new Error("unlock failed: " + res.status);
        locked = false;
        setTitle(game.title);
      }).catch(function (err) {
        console.warn(err);
        setTimeout(watchForPlay, 3000); // try again shortly
      });
    }, 250);
  }

  // Has this person unlocked the game? Without a server (e.g. GitHub Pages)
  // everything counts as unlocked.
  // Also: mature games their grade allows count as unlocked (they never lock),
  // and ones above their grade come back "blocked" and are taken out of
  // window.GAMES so "Another Game?" can't pick them.
  // Hidden games this student made visible (pressing "Another Game?" enough):
  // add them to window.GAMES so "Another Game?" can pick them too.
  function addEarned(list) {
    (list || []).forEach(function (g) {
      if (!(window.GAMES || []).some(function (x) { return x.id === g.id; })) window.GAMES.push(g);
    });
  }
  function earnedGames() {
    return fetch("/api/unlocks", { credentials: "same-origin" }).then(function (res) {
      var type = res.headers.get("Content-Type") || "";
      return res.ok && type.indexOf("application/json") !== -1 ? res.json() : null;
    }).then(function (data) {
      addEarned(data && data.earned);
      return (data && data.earned) || [];
    }).catch(function () { return []; });
  }

  function unlockedHere(gameId) {
    return fetch("/api/unlocks", { credentials: "same-origin" }).then(function (res) {
      var type = res.headers.get("Content-Type") || "";
      return res.ok && type.indexOf("application/json") !== -1 ? res.json() : null;
    }).then(function (data) {
      if (!data || data.all) return true;
      var blocked = data.blocked || [];
      window.GAMES = (window.GAMES || []).filter(function (g) { return blocked.indexOf(g.id) === -1; });
      if (blocked.indexOf(gameId) !== -1) return "blocked";
      addEarned(data.earned);
      return data.unlocked.indexOf(gameId) !== -1 || (data.open || []).indexOf(gameId) !== -1;
    }).catch(function () { return true; });
  }

  var id = new URLSearchParams(location.search).get("game");

  // "Another Game?" jumps to a random game other than this one, from every
  // game this person can see (locked ones too: playing one unlocks it).
  // With no other game to pick, it stays a plain link to the homepage.
  document.getElementById("another-game").addEventListener("click", function (e) {
    var others = (window.GAMES || []).filter(function (g) { return g.id !== id; });
    if (!others.length) return;
    e.preventDefault();
    var pick = others[Math.floor(Math.random() * others.length)];
    var button = e.currentTarget;
    button.style.pointerEvents = "none"; // one press at a time
    function go(gameId) { location.href = "play.html?game=" + encodeURIComponent(gameId); }
    // Count the press first: the press that reveals a hidden game shows the
    // "Wait... a hidden game?" pop-up and goes to that game instead. If the
    // server is slow (or missing), go to the random pick after 1.5 seconds.
    var done = false;
    var fallback = setTimeout(function () { done = true; go(pick.id); }, 1500);
    fetch("/api/another-game", {
      method: "POST", credentials: "same-origin", keepalive: true,
      headers: { "Content-Type": "application/json" }, body: "{}"
    }).then(function (res) { return res.ok ? res.json() : null; })
      .catch(function () { return null; })
      .then(function (r) {
        if (done) return;
        clearTimeout(fallback);
        var found = r && r.earned && r.earned[0];
        if (found) revealHiddenGame(found); else go(pick.id);
      });
  });

  // "Wait... a hidden game?" pop-up, then off to that game. Used when a press
  // of "Another Game?", a comment (comments.js) or a rating reveals a hidden
  // game. found: {id, title} from the server's "earned" list.
  function revealHiddenGame(found) {
    var box = document.getElementById("hidden-found");
    if (box.open) return;
    // Any way of closing it (button, Esc) goes to the hidden game.
    box.addEventListener("close", function () {
      location.href = "play.html?game=" + encodeURIComponent(found.id);
    }, { once: true });
    box.showModal();
  }
  window.revealHiddenGame = revealHiddenGame;
  // Admins don't get the button.
  fetch("/api/me", { credentials: "same-origin" }).then(function (res) {
    var type = res.headers.get("Content-Type") || "";
    return res.ok && type.indexOf("application/json") !== -1 ? res.json() : null;
  }).then(function (data) {
    if (data && data.user && data.user.admin) document.getElementById("another-game").hidden = true;
  }).catch(function () {});
  var game = (window.GAMES || []).filter(function (g) { return g.id === id; })[0];
  // Hidden games (file in games/hidden/): gold accents on the window.
  if (game && /^games\/hidden\//.test(game.file || "")) bezel.classList.add("hidden-game");

  // Restart asks first. Cancel, Esc or clicking outside the box does nothing.
  var confirmBox = document.getElementById("confirm-restart");
  document.getElementById("reload").addEventListener("click", function () {
    if (!last) return;
    confirmBox.returnValue = "";
    confirmBox.showModal();
  });
  confirmBox.addEventListener("close", function () {
    if (confirmBox.returnValue === "yes" && last) play(last.source, last.label);
  });
  confirmBox.addEventListener("click", function (e) {
    if (e.target === confirmBox) confirmBox.close(); // clicked the dimmed backdrop
  });

  // ---- Play time. Every 5 seconds, counts 5 seconds of play if the game is
  // running (not locked or loading), this tab is on screen, and the player
  // has touched the keyboard, mouse or screen in the last 3 minutes. Sends
  // the count to the server about once a minute, and when leaving the page.
  // The server (api_playtime) caps it to real time.
  var TICK = 5, IDLE_AFTER = 3 * 60 * 1000, REPORT_EVERY = 60;
  var lastInput = Date.now(), activeSeconds = 0, sinceReport = 0;
  ["keydown", "pointerdown", "pointermove", "wheel", "touchstart"].forEach(function (type) {
    window.addEventListener(type, function () { lastInput = Date.now(); },
                            { capture: true, passive: true });
  });
  function reportPlay() {
    if (!activeSeconds || !game) return;
    var seconds = activeSeconds;
    activeSeconds = 0;
    sinceReport = 0;
    fetch("/api/games/" + encodeURIComponent(game.id) + "/playtime", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ seconds: seconds }),
      keepalive: true // still sent while the page is closing
    }).catch(function () { /* no server (e.g. GitHub Pages): not tracked */ });
  }
  setInterval(function () {
    var playing = game && !locked && player && player.isPlaying &&
                  document.visibilityState === "visible" &&
                  Date.now() - lastInput < IDLE_AFTER;
    if (playing) activeSeconds += TICK;
    sinceReport += TICK;
    if (sinceReport >= REPORT_EVERY) reportPlay();
  }, TICK * 1000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") reportPlay();
  });
  window.addEventListener("pagehide", reportPlay);

  // Mute: remembered across games and visits on this computer.
  var muteBtn = document.getElementById("mute");
  var muted = false;
  try { muted = localStorage.getItem("club-muted") === "1"; } catch (e) {}
  function applyMute() {
    muteBtn.setAttribute("aria-pressed", muted ? "true" : "false");
    muteBtn.title = muted ? "Unmute" : "Mute";
    muteBtn.setAttribute("aria-label", muteBtn.title);
    if (player && "volume" in player) player.volume = muted ? 0 : 1;
  }
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    try { localStorage.setItem("club-muted", muted ? "1" : "0"); } catch (e) {}
    applyMute();
  });
  applyMute();

  document.getElementById("full").addEventListener("click", function () {
    if (player && player.enterFullscreen) player.enterFullscreen();
    else if (stage.requestFullscreen) stage.requestFullscreen();
  });

  window.addEventListener("load", function () {
    // Not in the lists this page loaded? It may be a hidden game this student
    // earned, which only the server knows about.
    var found = game || !id ? Promise.resolve() : earnedGames().then(function (list) {
      game = list.filter(function (g) { return g.id === id; })[0];
      if (game && /^games\/hidden\//.test(game.file || "")) bezel.classList.add("hidden-game");
    });
    found.then(start);
  });
  function start() {
    if (game) {
      setTitle("???");
      // Optional override from games.js, used until the game reports its own size.
      if (game.ratio) {
        var parts = String(game.ratio).split("/");
        setRatio(parseFloat(parts[0]), parseFloat(parts[1] || 1));
      }
      // Fetch this person's saves from the server first, so the game finds them.
      show("Loading your saves…");
      var ready = Promise.all([
        window.cloudSaves ? cloudSaves.start() : Promise.resolve(),
        unlockedHere(game.id),
        sizeBeforeStart(game)
      ]);
      ready.then(function (results) {
        if (results[1] === "blocked") {
          setTitle("Not available");
          show('This game isn\'t available. <a href="index.html">Pick another game</a>');
          return;
        }
        locked = !results[1];
        if (!locked) setTitle(game.title);
        // encodeURI handles file names with spaces
        play({ url: encodeURI(game.file) }, game.title);
      });
    } else if (id) {
      show('No game called "' + id.replace(/[<>&"]/g, "") + '". <a href="index.html">See all games</a>');
    } else {
      show('Choose a game from the <a href="index.html">homepage</a>.');
    }
  }
</script>
</body>
</html>
